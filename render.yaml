services:
  - type: web
    name: docuquery-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt          # pick the region closest to your users
    autoDeploy: true           # redeploy on push to the connected branch
    healthCheckPath: /api/health
    envVars:
      # Required — set these in the Render dashboard (marked secret).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional — uncomment / set in the dashboard as needed.
      # - key: ALLOWED_ORIGINS        # e.g. https://your-app.vercel.app
      #   sync: false
      # - key: GENERATION_MODEL       # override the default chat model
      #   sync: false
      # - key: MAX_UPLOAD_MB          # Free plan file limit (default 10)
      #   value: "10"
      # Pro is a demo with no payment. Set to false to switch the Upgrade button off.
      # - key: BILLING_DEMO_MODE
      #   value: "true"
      # - key: FRONTEND_URL           # your site, used by password-reset emails
      #   sync: false
